# SYP — непрерывная проверка.
#
# Проверяется ровно то, что перечислено в `AGENTS.md` § Tier-2 «Обязательная
# проверка после любого изменения», плюс guards из § Tier-2 «Каталог guards».
# Ветка master защищена (constitution VII), поэтому проверки обязаны
# воспроизводиться локально: то, что здесь падает, не должно пройти при слиянии.

name: ci

on:
  push:
    branches: ["master", "*-*"]
  pull_request:
    branches: ["master"]

jobs:
  # --- Документация и guards: быстрые, без сборки ----------------------------
  docs-and-guards:
    name: Документация и guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить PyYAML для линтера документации
        run: pip install pyyaml

      - name: Линтер живой документации
        run: python3 docs/scripts/lint-docs.py

      - name: Guards предметной области и окружения
        run: |
          bash tools/check-no-jpa-imports.sh
          bash tools/check-no-mp4-mentions.sh
          bash tools/check-feature-doc.sh
          bash tools/check-frontend-build.sh
          bash tools/check-no-job-worker.sh
          bash tools/check-no-video-endpoints.sh
          bash tools/check-container-restart.sh

      - name: Guards процесса
        run: |
          python3 tools/check-spec-issue-link.py
          python3 tools/check-ssot-impact.py

      - name: Покрытие задач требованиями
        run: python3 tools/check-tasks-coverage.py

      - name: Отсутствие секретов
        run: |
          leaked="$(git ls-files | grep -iE '\.env$|do\.env$|\.key$|\.pem$|\.p12$|\.pfx$' || true)"
          if [ -n "$leaked" ]; then
            echo "НАРУШЕНИЕ constitution VIII.3: отслеживаются файлы с секретами:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: файлов с секретами нет"

  # --- Бэкенд: сборка и линтер ----------------------------------------------
  backend:
    name: Бэкенд
    runs-on: ubuntu-latest
    env:
      # В CI кэш свой, путь машины администратора не используется: правило
      # GRADLE_USER_HOME проверяется guard-ом отдельно.
      GRADLE_USER_HOME: /home/runner/.gradle
      # Живая база для тестов. Без неё проверки, которым нужна база, молча
      # отменяются, и «тесты прошли» не значит ничего: их просто не было.
      SYP_TEST_DB_USER: postgres
      SYP_TEST_DB_PASSWORD: postgres
      # psql читает пароль из PGPASSWORD и без неё спрашивает его в терминале,
      # где ответа нет: шаг падал с «connection to server» вместо применения схемы.
      PGPASSWORD: postgres
      SYP_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/syp_test_core
      SYP_TEST_HTTP_URL: http://127.0.0.1:7911
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Схема тестовых баз из миграций
        run: |
          for database in syp_test_core syp_test_admin syp_test_public; do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "CREATE DATABASE $database;"
          done
          for database in syp_test_core syp_test_admin syp_test_public; do
            for file in deploy/syp-db/[0-9][0-9]_*.sql; do
              psql -h 127.0.0.1 -U postgres -d "$database" -v ON_ERROR_STOP=1 -q -f "$file"
            done
          done
          echo "схема применена во все три базы"

      - name: Компиляция всех модулей
        run: ./gradlew compileKotlin --parallel

      - name: Линтер Kotlin
        run: ./gradlew ktlintCheck

      - name: Исполняемые файлы бэкендов
        run: ./gradlew bootJar --parallel

      - name: Тесты
        run: ./gradlew test --parallel
        env:
          SYP_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/syp_test_core
          SYP_TEST_DB_URL_ADMIN: jdbc:postgresql://127.0.0.1:5432/syp_test_admin
          SYP_TEST_DB_URL_PUBLIC: jdbc:postgresql://127.0.0.1:5432/syp_test_public

  # --- Фронтенды: сборка и линтер -------------------------------------------
  frontends:
    name: Фронтенды
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: syp-admin-web
          - name: syp-public-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Hard Gate R-375: сборка идёт из каталога фронтенда, а не из корня.
      - name: Установить зависимости
        working-directory: ${{ matrix.name }}
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Линтер
        working-directory: ${{ matrix.name }}
        run: npm run lint

      - name: Сборка
        working-directory: ${{ matrix.name }}
        run: npm run build

      - name: Проверка форматирования
        working-directory: ${{ matrix.name }}
        run: npm run format:check

  # --- Воркер на машине пользователя ----------------------------------------
  worker:
    name: Воркер пользователя
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить PyYAML для guards
        # Guards читают `.ssot-map.yml`, и без PyYAML они падали с
        # ModuleNotFoundError — то есть проверка молча ничего не проверяла.
        run: python3 -m pip install --quiet PyYAML

      - name: Проверка синтаксиса воркера и примера настроек
        run: |
          # Сам воркер появляется позже среза (фаза 12). Пока файла нет,
          # проверяется только пример настроек; как только файл появится,
          # проверка заработает без правки этого сценария.
          if [ -f syp-worker/syp_worker.py ]; then
            python3 -m py_compile syp-worker/syp_worker.py
          else
            echo "файла syp-worker/syp_worker.py ещё нет: фаза 12 не начата"
          fi

      - name: Guards предметной области и окружения
        run: |
          bash tools/check-ci-valid.sh
          bash tools/check-old-table-names.sh
          bash tools/check-no-duplicate-api-prefix.sh
          bash tools/check-components-mounted.sh
          bash tools/check-node-modules-real.sh
          bash tools/check-subagent-brief-size.sh
          bash tools/check-ready-to-work.sh

      - name: Пример настройки воркера — корректный JSON
        run: |
          if [ -f syp-worker/config.example.json ]; then
            python3 -c "import json; json.load(open('syp-worker/config.example.json'))"
            echo "пример настройки разбирается"
          else
            echo "файла syp-worker/config.example.json ещё нет: проверять нечего"
          fi

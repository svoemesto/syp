# SYP — свойства сборки Gradle.
#
# Версии Kotlin и Spring Boot зафиксированы здесь и только здесь: смена версии
# — правка этого файла, а не объявление версии в модулях (T001).

# Версия Kotlin
kotlinVersion=2.2.20

# Версия Spring Boot
springBootVersion=3.5.6

# Версия плагина управления зависимостями Spring
springDependencyManagementVersion=1.1.7

# Версия ktlint-плагина Gradle
ktlintPluginVersion=12.3.0

# Версия Gradle, для которой сгенерирована обёртка
gradleVersion=8.14

# Версия байт-кода и API компиляции. Spring Boot 3.5 требует Java 17;
# собирать можно любым установленным JDK не ниже этой версии.
javaReleaseVersion=17

# Версия драйвера PostgreSQL (сырой JDBC, без ORM — constitution III)
postgresDriverVersion=42.7.7

# Версия клиента объектного хранилища MinIO
minioClientVersion=8.5.17

# JVM daemon и Kotlin daemon. Проект небольшой: 2g хватает с запасом.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g

# Модули собираются параллельно: сборка контракта Tier-2 в AGENTS.md
# использует флаг --parallel.
org.gradle.parallel=true
org.gradle.caching=true

# Версия проекта
version=0.1.0

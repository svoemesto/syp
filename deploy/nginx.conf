# SYP — конфигурация nginx фронтенда.
#
# Отдаёт собранный билд и проксирует запросы /api в свой бэкенд.
#
# Файл — шаблон официального образа nginx: переменная окружения
# ${SYP_API_UPSTREAM} подставляется при старте контейнера. Значение задаётся
# в deploy/docker-compose.yml и совпадает с именем контейнера бэкенда
# (Hard Gate Build/Deploy/Containers).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Приложение одностраничное: неизвестные пути отдают index.html,
    # чтобы работал прямой переход по адресу.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://${SYP_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Анализ эпизода идёт долго, но он выполняется заданием очереди:
        # долгий ответ здесь означает ошибку, а не нормальную работу.
        proxy_read_timeout 120s;
    }

    # Поток событий SSE. Отдельный блок, а не флаг у общего: буферизация
    # прокси для потока событий ломает главное его свойство — событие должно
    # приходить сразу, а не пачкой, когда наберётся. Таймаут чтения заведомо
    # больше сердцебия (15 секунд), иначе nginx счёл бы живое соединение
    # зависшим.
    location = /api/subscribe {
        proxy_pass http://${SYP_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

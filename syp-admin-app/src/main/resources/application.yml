# SYP — админский бэкенд.
#
# Значения читаются из окружения: секретов в файле нет и быть не должно
# (constitution VIII.5). Файл `deploy/.env` вне системы контроля версий.
server:
  port: ${SYP_ADMIN_WEB_PORT:7910}

spring:
  application:
    name: syp-admin-app
  datasource:
    url: ${SYP_DB_URL}
    username: ${SYP_DB_USER}
    password: ${SYP_DB_PASSWORD}
  # Автогенерация схемы запрещена (constitution III): схема создаётся только
  # нумерованными миграциями deploy/syp-db/NN_*.sql.
  sql:
    init:
      mode: never
  mvc:
    async:
      # Поток событий SSE живёт, пока жив поток. Без этого значения контейнер
      # обрывает асинхронный запрос по своему умолчанию (30 секунд), то есть
      # ровно тогда, когда сердцебие с интервалом 15 секунд ещё не пришло:
      # подписка помирала бы на живом соединении.
      request-timeout: -1

logging:
  level:
    root: INFO
